# Builds the game for Windows (`cargo build -p launcher --profile play`)
# and keeps CodLegacy.exe as a downloadable artifact of the run: on every push
# to main and on demand from the Actions tab.
name: Windows build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: windows-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Rust (rust-toolchain.toml)
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Build
        run: cargo build -p launcher --profile play

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\play\CodLegacy.exe dist\CodLegacy.exe
          git log -1 --format="%h %s" | Out-File -Encoding utf8 dist\build.txt

      - uses: actions/upload-artifact@v4
        with:
          name: codlegacy-windows-${{ github.sha }}
          path: dist/
          retention-days: 14
