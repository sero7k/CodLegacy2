[package]
name = "assets"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Asset lane orchestration, linking and conversion into engine objects."

[features]
# bo2mp: games left out of the game (owner, 5 Nov 2026); their lanes come
# back with these. Off: `lane::dropped` stands in.
iw7 = ["dep:fastfile_iw7", "asset_audio/iw7"]
jup = ["dep:fastfile_jup", "asset_audio/jup"]

[dependencies]
codlegacy_env.workspace = true
server_pack.workspace = true # bo2mp: dedicated server map packs
render_material.workspace = true
diag.workspace = true
xmodel_runtime.workspace = true
asset_core.workspace = true
asset_anim.workspace = true
asset_audio.workspace = true
fx_iw4.workspace = true
asset_game.workspace = true
asset_material.workspace = true
asset_model.workspace = true
asset_transport.workspace = true
map_bake.workspace = true # bo2mp: the bake's row on the loading screen
bo2_profile.workspace = true # bo2mp guest guns
asset_world.workspace = true
iw3 = { path = "../iw3" } # bo2mp: Call of Duty 4 maps
t4 = { path = "../t4" } # bo2mp: World at War maps
weapon_iw4.workspace = true
fastfile_iw4.workspace = true
fastfile_t5.workspace = true
fastfile_iw5.workspace = true
fastfile_t6.workspace = true # bo2zm
asset_t6.workspace = true # bo2zm
fastfile_iw6.workspace = true # bo2mp: Ghosts guest guns
gsc_iw6_vm.workspace = true # bo2mp: which effects and models a Ghosts map's scripts name
fastfile_s1.workspace = true # bo2mp: Advanced Warfare guest guns
fastfile_h1.workspace = true # bo2mp: Modern Warfare Remastered maps
fastfile_iw7 = { workspace = true, optional = true } # bo2mp: Infinite Warfare maps (feature `iw7`)
fastfile_t7.workspace = true # bo2mp: Black Ops III maps
fastfile_jup = { workspace = true, optional = true } # bo2mp: Modern Warfare III (2023) maps (feature `jup`)
hks_t6.workspace = true # bo2zm M4
bcdec_rs.workspace = true # bo2zm M4: additive HUD pictures
ipak_t6.workspace = true # bo2zm
asset_iw4.workspace = true
clipmap_iw4.workspace = true
# Light-grid CPU sample chain for authored smodel `$model_lighting` tiles.
lighting_iw4.workspace = true
bevy.workspace = true
frame.workspace = true
serde_json.workspace = true
serde.workspace = true
async-lock.workspace = true
lz4_flex.workspace = true # bo2mp: the converted Modern Warfare III map's cache
png.workspace = true
# bo2mp: BAKE ALL bakes BO3 maps (`bake_all`); also `examples/bo2_shared_look_check`.
render_t7.workspace = true
# bo2mp: the Modern Warfare Remastered map's glass panes (`h1_map`: `render_h1::glass`;
# render_h1 does not depend on the asset lane); also `examples/jup_bo3_shot`.
render_h1.workspace = true

# `load_pool` puts its workers back on the process's CPUs (`session_load`).
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

# bo2mp: the BO3 fall-through test walks the match's own movement.
[dev-dependencies]
# bo2mp: `examples/jup_bo3_shot` (an MW3 map in the BO3 look, headless)
wgpu = "29"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
glam = "0.32.1"
movement_iw4.workspace = true
playerstate_iw4.workspace = true
trace_iw4.workspace = true

[lints]
workspace = true

[[example]]
name = "jup_bo3_shot"
required-features = ["jup"]

[[example]]
name = "jup_export"
required-features = ["jup"]

[[example]]
name = "jup_gun_audit"
required-features = ["jup"]
