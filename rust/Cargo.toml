# quinn-proto 0.11.17 subtracts evicted DATAGRAM bytes twice and panics under
# relay backpressure. Pin the upstream 0.11.x fix for both clients and master.
# Remove when a crates.io release includes quinn-rs/quinn#2806.
#
# wgpu-hal 29.0.4 (and 30.0.1) treats a swap-chain image that takes over a second to come back
# from the presentation engine as a lost graphics device, which ends the game. The copy in
# third_party/wgpu-hal waits again instead (see "bo2mp patch" in src/vulkan/swapchain/native.rs).
# Remove when an upstream release stops mapping that VK_TIMEOUT to DeviceError::Unexpected.
[patch.crates-io]
quinn-proto = { git = "https://github.com/quinn-rs/quinn", rev = "f650e0f213b01ea7bebd60023e5df7df65e5c2bd" }
wgpu-hal = { path = "third_party/wgpu-hal" }
# bo2mp: a master bus with a meter and a limiter between every sound and the
# device (third_party/bevy_audio/src/master_bus.rs); the rest is crates.io 0.19.0.
bevy_audio = { path = "third_party/bevy_audio" }

