# Map intro music: which track plays for about 50 seconds when a player joins
# a match on a map (Black Ops' join music). Plain text, edit freely.
#
# The music director reads this table (crates/audio/src/music/map_intro.rs)
# when a match starts. Not yet tested on the PC.
#
# Line forms (`#` starts a comment):
#   @name = entry, entry     a named set of tracks
#   default <game> = ...     what a map of that game gets when it has no line below
#   default * = ...          what any other map gets
#   <game>:<map> = ...       one map's tracks (the zone name and its game prefix)
#
# <game> is the zone prefix: t6 Black Ops II, t5 Black Ops, t4 World at War,
# iw3 Call of Duty 4, h1 Modern Warfare Remastered, iw4 Modern Warfare 2,
# iw5 Modern Warfare 3, jup Modern Warfare III (2023), iw6 Ghosts,
# iw7 Infinite Warfare, t7 Black Ops III, s1 Advanced Warfare.
# A map the game has not got a line for is tried by its zone name under the
# other games (Horizon MW's ports in MWR), then the game's default.
#
# An entry is what `music.cfg` playlists take: a game alias (t6: t5: iw4: iw5:
# ghosts:) or a file path. A map with several tracks always plays the same one
# (picked by its name) unless that track is not installed.
#
# Only these tracks exist as real, playable data in this project (the games'
# menu music; Ghosts' menu zone music). Black Ops' own per-map join music
# aliases are NOT known from anything in the repository, so none are guessed:
# once their alias names are known, put them on the `t5:` lines below (or
# in music.cfg: `intro = t5:mp_nuked t5:<alias>`). The practical way to get the
# real tracks today: drop an .mp3/.ogg/.wav/.flac named after the map
# (`mp_nuked.mp3`, or `t5_mp_nuked.mp3` for one game's) into music/intro/ beside
# the exe; it wins over this table.
#
# Zombies maps (zm_*) are left out: Zombies has its own music (bo2zm_music).

# --- the tracks, by mood ---
@bo2          = t6:mus_mp_frontend
@coldwar      = t5:mus_mp_frontend
@war          = t5:mus_mp_frontend
@nuk          = t5:mus_mp_frontend, t6:mus_mp_frontend
@modern       = iw4:music_mainmenu_mp, iw5:music_mainmenu_mp
@covert       = ghosts:music_mainmenu_squad, ghosts:music_mainmenu_rorke_files, iw4:music_mainmenu_mp
@modern2      = iw5:music_mainmenu_mp, iw4:music_mainmenu_mp
@covert2      = ghosts:music_mainmenu_rorke_files, ghosts:music_mainmenu_squad, iw5:music_mainmenu_mp
@ghosts_war   = ghosts:music_mainmenu_mp, ghosts:music_mainmenu, ghosts:music_mainmenu_squad
@ghosts_wild  = ghosts:music_mainmenu_extinct, ghosts:music_mainmenu_rorke_files
@future       = t6:mus_mp_frontend, ghosts:music_mainmenu_extinct, ghosts:music_mainmenu
@future_dark  = ghosts:music_mainmenu_extinct, ghosts:music_mainmenu_rorke_files, t6:mus_mp_frontend

# --- game defaults ---
default t6  = @bo2
default t5  = @coldwar
default t4  = @war
default iw3 = @modern
default h1  = @modern
default iw4 = @modern
default iw5 = @modern2
default jup = @modern2
default iw6 = @ghosts_war
default iw7 = @future
default t7  = @future
default s1  = @future
default *   = @modern

