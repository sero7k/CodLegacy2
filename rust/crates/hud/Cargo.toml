[features]
# bo2mp: Infinite Warfare, left out of the game (owner, 5 Nov 2026).
iw7 = ["dep:fastfile_iw7", "asset_audio/iw7"]

[dependencies]
codlegacy_env.workspace = true
diag.workspace = true
bevy.workspace = true
asset_core.workspace = true
asset_game.workspace = true
asset_material.workspace = true
asset_transport.workspace = true
fastfile_iw6.workspace = true # bo2mp: Ghosts kill icons
fastfile_h1.workspace = true # bo2mp: Horizon MW kill icons
fastfile_iw7 = { workspace = true, optional = true } # bo2mp: Infinite Warfare kill icons (feature `iw7`)
asset_audio.workspace = true # bo2mp: where Horizon MW's weapon zones are
assets.workspace = true
hud_iw4 = { path = "../hud_iw4" }
weapon_iw4 = { path = "../weapon_iw4" }
movement_iw4 = { path = "../movement_iw4" }
playerstate_iw4 = { path = "../playerstate_iw4" }
entity_iw4.workspace = true
frame.workspace = true
net = { path = "../net" }
sim = { path = "../sim" }
math_iw4.workspace = true
gamemode_iw4.workspace = true
ui.workspace = true

[lints]
workspace = true
