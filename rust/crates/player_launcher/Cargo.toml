[package]
name = "player_launcher"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The player-facing CodLegacy launcher app: launcher-key sign-in, news, game scan, signed build updates, start the game with a join ticket."

[lib]
name = "codlegacy_launcher"
path = "src/lib.rs"

[[bin]]
name = "codlegacy-launcher"
path = "src/main.rs"
required-features = ["gui"]

[[bin]]
name = "codlegacy-publish"
path = "src/bin/publish.rs"

[features]
default = ["gui"]
gui = ["dep:eframe"]

[dependencies]
asset_transport.workspace = true
call_of_claude = { path = "../call_of_claude" }
eframe = { version = "0.34", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"], optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
getrandom = "0.3"
sha2 = "0.10"
ureq = "3.1"
url = "2.5.8"

[dev-dependencies]
tempfile = "3"
accounts = { path = "../accounts" }
axum = "0.8.9"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "net"] }

[lints]
workspace = true
